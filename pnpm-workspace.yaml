packages:
  - 'apps/*'
  - 'packages/*'

# Approve install scripts for trusted dependencies.
# pnpm disables postinstall scripts by default for security — these are
# essential native builds (Prisma engines, esbuild binary).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  # dtrace-provider is an optional native dep of bunyan (pulled in via eas-cli).
  # It only builds on Solaris/macOS — skip on Linux (EAS builders) to avoid
  # a non-zero exit code in `pnpm install --frozen-lockfile`.
  dtrace-provider: false
  # sharp is Next.js image optimization — prebuilt binaries, safe to allow.
  sharp: true

nodeLinker: hoisted

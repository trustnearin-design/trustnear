version: 1
applications:
  - appRoot: apps/admin
    frontend:
      phases:
        preBuild:
          commands:
            # Amplify Hosting builds run on Amazon Linux 2023 with Node 20+
            # but no pnpm. Install pinned pnpm matching workspace.
            - npm install -g pnpm@11.1.3
            # Install dependencies for the admin app + its transitive workspace
            # deps (db / types / utils / tsconfig). --filter scopes the install
            # so we don't pull customer/pro/api node_modules on every build.
            - cd ../.. && pnpm install --frozen-lockfile --filter "@sevalink/admin..."
        build:
          commands:
            # Admin doesn't import @sevalink/db directly — it talks to the
            # staging API over HTTP — so we skip `prisma generate` here.
            # If admin ever adds a direct DB call, restore this line:
            #   - cd packages/db && pnpm exec prisma generate
            # (note: must be a `cd` into the package, not pnpm --filter exec,
            # because Amplify's CodeBuild sandbox forbids pnpm's implicit
            # dep-status temp-file write outside the repo working dir.)
            - cd ../.. && pnpm --filter @sevalink/admin build
      artifacts:
        # Amplify Next.js SSR needs the .next dir as the build output
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - ../../node_modules/**/*
          - ../../packages/db/node_modules/**/*
          - .next/cache/**/*

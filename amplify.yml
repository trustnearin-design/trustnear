version: 1
applications:
  - appRoot: apps/admin
    frontend:
      phases:
        preBuild:
          commands:
            # Build #8 diagnostic confirmed: preBuild starts in appRoot
            # (apps/admin) and build starts in REPO ROOT (different CWDs
            # per phase — yes, really). So preBuild walks up to repo
            # root with cd ../.. and build walks DOWN to apps/admin.
            - npm install -g pnpm@11.1.3
            - cd ../.. && pnpm install --frozen-lockfile --filter "@sevalink/admin..."
        build:
          commands:
            # Skip pnpm CLI (its runDepsStatusCheck subprocess EACCESes
            # in CodeBuild — builds #1-4). Just invoke next directly.
            # CWD here is repo root, so cd into apps/admin first.
            # next binary lives at the HOISTED root node_modules — the
            # workspace's node-linker=hoisted pnpm setup puts every bin
            # at <repo>/node_modules/.bin, NOT at apps/admin/node_modules/.bin
            # (build #9 confirmed `cd apps/admin && node_modules/.bin/next`
            # gives "No such file or directory"). Walk back up to the
            # hoisted bin while keeping CWD inside apps/admin so next
            # discovers the right next.config.ts + src/app/ layout.
            - cd apps/admin && ../../node_modules/.bin/next build
      artifacts:
        # baseDirectory is relative to appRoot, so apps/admin/.next/
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - ../../node_modules/**/*
          - .next/cache/**/*

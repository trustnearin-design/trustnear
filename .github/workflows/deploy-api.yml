# ─────────────────────────────────────────────────────────────────────
# Build → push → deploy the SEVALINK / TrustNear API to Amazon ECS.
#
# We build the Hono API image, push it to ECR, then force a new ECS
# deployment so the service re-pulls the freshly-pushed `:latest` image.
#
# Triggers:
#   - push to `main` (auto-deploy)
#   - manual workflow_dispatch (for staging / hotfix re-deploy)
#
# Required GitHub repo secrets:
#   AWS_REGION              ap-south-1 (Mumbai)
#   AWS_DEPLOY_ROLE_ARN     IAM role ARN assumed via OIDC, with:
#                             - ECR push (ecr:* on the repo)
#                             - ecs:UpdateService + ecs:DescribeServices
#                               on the service below
#   ECS_CLUSTER             ECS cluster name (or ARN) hosting the API
#   ECS_SERVICE             ECS service name (or ARN) for the API
#
# IMPORTANT — image tag assumption:
#   This uses `aws ecs update-service --force-new-deployment`, which only
#   re-pulls a NEW image if the service's task definition references a
#   MUTABLE tag (i.e. `:latest`). The build step below pushes both
#   `:<sha>` and `:latest`, so make sure the ECS task definition's
#   container image is `…/trustnear-api:latest`. If it pins a specific
#   revision/SHA instead, switch to the task-definition-revision flow
#   (register-task-definition with the :<sha> image, then update-service
#   --task-definition) — see the commented block at the bottom.
#
# IAM / OIDC setup (one-time, console or Terraform):
#   1. Create OIDC provider for token.actions.githubusercontent.com
#   2. Create role `github-actions-deploy` trusting this repo's main branch
#   3. Attach inline policy: ecr:* (repo) + ecs:UpdateService +
#      ecs:DescribeServices (service ARN)
# ─────────────────────────────────────────────────────────────────────

name: Deploy API → Amazon ECS

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/db/**'
      - 'packages/types/**'
      - 'packages/utils/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you manually re-deploying?'
        required: false
        default: 'hotfix'

concurrency:
  # One deploy at a time per branch — newer pushes cancel in-flight builds.
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # OIDC token for AWS
  contents: read

env:
  ECR_REPOSITORY: trustnear-api
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Trigger ECS deployment (force new deployment)
        run: |
          DEPLOY_ID=$(aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.ECS_SERVICE }}" \
            --force-new-deployment \
            --region "${{ secrets.AWS_REGION }}" \
            --query 'service.deployments[0].id' --output text)
          echo "Started ECS deployment: $DEPLOY_ID"

      - name: Wait for service to stabilize
        run: |
          # `aws ecs wait services-stable` gives up after a fixed ~10 min
          # (40 × 15s). On the small Fargate task a slightly-slow rollout +
          # old-task draining can take a touch longer, which made the waiter
          # exit non-zero even though the deploy actually succeeded (red
          # "All jobs failed" email for a healthy deploy). So we loop the
          # waiter up to ~20 min and treat a COMPLETED primary rollout as
          # success — only a genuine FAILED rollout or true timeout fails.
          rollout_state() {
            aws ecs describe-services \
              --cluster "${{ secrets.ECS_CLUSTER }}" \
              --services "${{ secrets.ECS_SERVICE }}" \
              --region "${{ secrets.AWS_REGION }}" \
              --query 'services[0].deployments[?status==`PRIMARY`].rolloutState | [0]' \
              --output text 2>/dev/null
          }
          echo "Waiting for ECS deployment to complete (up to ~20 min)..."
          for attempt in 1 2; do
            if aws ecs wait services-stable \
                --cluster "${{ secrets.ECS_CLUSTER }}" \
                --service "${{ secrets.ECS_SERVICE }}" \
                --region "${{ secrets.AWS_REGION }}"; then
              echo "✅ ECS service is stable — deployment succeeded"
              exit 0
            fi
            STATE=$(rollout_state)
            echo "⏳ Waiter attempt $attempt timed out; primary rolloutState=$STATE"
            if [ "$STATE" = "COMPLETED" ]; then
              echo "✅ Primary deployment COMPLETED — deployment succeeded"
              exit 0
            fi
            if [ "$STATE" = "FAILED" ]; then
              echo "❌ Primary deployment FAILED (ECS rolled back) — failing the job"
              exit 1
            fi
          done
          echo "❌ Service did not stabilize within ~20 min — investigate ECS"
          exit 1

# ─────────────────────────────────────────────────────────────────────
